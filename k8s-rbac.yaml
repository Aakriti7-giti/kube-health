apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-health-readonly
  labels:
    app: kube-health
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "namespaces", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-health-readonly-binding
subjects:
- kind: ServiceAccount
  name: kube-health-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: kube-health-readonly
  apiGroup: rbac.authorization.k8s.io