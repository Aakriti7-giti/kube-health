version: 2
before:
  hooks:
        - go mod tidy
builds:
    - env:
            - CGO_ENABLED=0
    goos:
            - linux
            - darwin
            - windows
    goarch:
            - amd64
            - arm64
    ldflags:
            - -s -w
    binary: kube-health
archives:
    - id: kube-health
    builds:
            - kube-health
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
            - goos: windows
        format: zip
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"